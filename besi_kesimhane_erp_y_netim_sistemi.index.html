    // =========================================================================
    // YARDIMCI TARİH & FORMAT FONKSİYONLARI (GLOBAL ÇÖZÜM)
    // =========================================================================
    function todayISO() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    function addDaysISO(dateStr, days) {
      const d = new Date(dateStr);
      d.setDate(d.getDate() + Number(days));
      return d.toISOString().slice(0, 10);
    }

    function daysBetween(d1, d2) {
      const diff = new Date(d2) - new Date(d1);
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function getMonthKey(dateStr) {
      return String(dateStr || "").slice(0, 7);
    }

    function getLastThreeMonths() {
      const result = [];
      const d = new Date();
      for (let i = 0; i < 3; i++) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const key = `${year}-${month}`;
        const label = d.toLocaleDateString("tr-TR", { month: "long", year: "numeric" });
        result.push({ key, label });
        d.setMonth(d.getMonth() - 1);
      }
      return result;
    }

    function uid(prefix = "id") {
      return prefix + "_" + Math.random().toString(36).substr(2, 9);
    }

    function formatCurrency(val) {
      return Number(val || 0).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₺";
    }

    function formatNumber(val) {
      return Number(val || 0).toLocaleString("tr-TR", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function showToast(msg, type = "success") {
      toastMessage = { msg, type };
      render();
      setTimeout(() => {
        if (toastMessage && toastMessage.msg === msg) {
          toastMessage = null;
          render();
        }
      }, 3500);
    }

    // =========================================================================

    const CUSTOM_FB_CONFIG_KEY = "besi_kesimhane_erp_fb_config_v4";

    let auth = null;

    let isRemoteUpdating = false;

    function getActiveFirebaseConfig() {
      try {

      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        try {
          return typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
        } catch (e) {}

    }

    // =========================================================================

    const DEFAULT_USERS = [

      etPayments: [],
      slaughters: [],
      sakatatPayments: [],
      sakatatAdjustments: [],

      checks: [],
      creditCards: [],
      deferredPayables: [],

    function cloneObj(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function loadInitialLocalState() {
      try {
        const raw = localStorage.getItem(LOCAL_STATE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            ...cloneObj(INITIAL_STATE),
            ...parsed,
            brand: { ...DEFAULT_BRAND, ...(parsed.brand || {}) },
            prices: { ...DEFAULT_PRICES, ...(parsed.prices || {}) }
          };
        }
      } catch (e) {}
      return cloneObj(INITIAL_STATE);
    }

    let state = loadInitialLocalState();
    let currentUser = null;
    try {
      const savedSession = localStorage.getItem(LOCAL_USER_KEY);
      if (savedSession) {
        const parsedUser = JSON.parse(savedSession);
        const matched = state.users.find(u => u.id === parsedUser.id || u.username === parsedUser.username);
        if (matched) currentUser = matched;
      }
    } catch (e) {}

    let activeTab = "genel-bakis";
    let activeEtSubTab = "et-satis";
    let activeAhirSubTab = "ahir-takip";
    let modalHtml = "";
    let toastMessage = null;
    let pdfPreviewData = null;

    // saveState fonksiyonu: Verileri yerel depolamaya ve buluta senkronize eder
    function saveState() {
      try {
        localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(state));
      } catch (err) {}

      if (isCloudReady && db && !isRemoteUpdating) {
        try {
          const docRef = doc(db, "artifacts", appId, "public", "data", "erp_master_state", "singleton");
          setDoc(docRef, { payload: JSON.stringify(state) });
        } catch (err) {}
      }
    }

    // Kayıtlı oturum varsa başlangıç sekmesini kullanıcının yetkili olduğu ilk sekmeye hizala
    if (currentUser) {
      const initialAllowed = ALL_MODULES.filter(m => {
        if (currentUser.role === "Admin") {
          return !["veteriner-takvim", "muhasebe-faturali", "muhasebe-gider-fisleri"].includes(m.id);
        }
        const p = state.permissions?.[currentUser.role] || DEFAULT_ROLE_PERMISSIONS[currentUser.role] || { tabs: [] };
        return Array.isArray(p.tabs) && p.tabs.includes(m.id);
      });
      if (initialAllowed.length > 0 && !initialAllowed.some(m => m.id === activeTab)) {
        activeTab = initialAllowed[0].id;
      }
    }

    async function initCloudSync() {
      const cfg = getActiveFirebaseConfig();
      if (!cfg) {
        cloudStatus = "Yerel Depolama (Ayarlar'dan Bulut Bağlanabilir)";
        return;
      }
      try {
        const fbApp = initializeApp(cfg, "erp_cloud_" + Date.now());
        auth = getAuth(fbApp);
        db = getFirestore(fbApp);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, (user) => {
          if (user) {
            isCloudReady = true;
            cloudStatus = "Buluta Bağlandı";
            const docRef = doc(db, "artifacts", appId, "public", "data", "erp_master_state", "singleton");
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            unsubscribeSnapshot = onSnapshot(docRef, (snap) => {
              if (snap.exists()) {
                const data = snap.data();
                if (data && data.payload) {
                  try {
                    const remoteState = JSON.parse(data.payload);
                    isRemoteUpdating = true;
                    state = {
                      ...cloneObj(INITIAL_STATE),
                      ...remoteState,
                      brand: { ...DEFAULT_BRAND, ...(remoteState.brand || {}) },
                      prices: { ...DEFAULT_PRICES, ...(remoteState.prices || {}) }
                    };
                    localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(state));
                    lastSyncTime = new Date().toLocaleTimeString("tr-TR");
                    cloudStatus = "Bulut Aktif (" + lastSyncTime + ")";
                    if (currentUser) {
                      const updatedSelf = state.users.find(u => u.id === currentUser.id);
                      if (updatedSelf) currentUser = updatedSelf;
                    }
                    render();
                    isRemoteUpdating = false;
                  } catch (e) {
                    isRemoteUpdating = false;
                  }
                }
              } else {
                saveState();
              }
            }, (err) => {
              cloudStatus = "Bulut Dinleme Hatası";
              render();
            });
          }
        });
      } catch (err) {
        cloudStatus = "Yerel Depolama Aktif";
      }
    }

    // =========================================================================
    // 4. YETKİ KONTROL & OTOMASYON MOTORLARI
    // =========================================================================
    function getEffectivePermissions(role) {
      const fallback = DEFAULT_ROLE_PERMISSIONS[role] || { tabs: [], subTabs: [], actions: [] };
      const stored = state.permissions?.[role];
      if (!stored) return fallback;
      return {
        tabs: Array.isArray(stored.tabs) ? stored.tabs : fallback.tabs,
        subTabs: Array.isArray(stored.subTabs) ? stored.subTabs : fallback.subTabs,
        actions: Array.isArray(stored.actions) ? stored.actions : fallback.actions
      };
    }

    function hasTabAccess(tabId) {
      if (!currentUser) return false;
      if (currentUser.role === "Admin") {
        return !["veteriner-takvim", "muhasebe-faturali", "muhasebe-gider-fisleri"].includes(tabId);
      }
      const perms = getEffectivePermissions(currentUser.role);
      return perms.tabs.includes(tabId);
    }

    function hasSubTabAccess(subId) {
      if (!currentUser) return false;
      if (currentUser.role === "Admin") return true;
      const perms = getEffectivePermissions(currentUser.role);
      return perms.subTabs.includes(subId);
    }

    function hasActionAccess(actionId) {
      if (!currentUser) return false;
      if (currentUser.role === "Admin") return true;
      const perms = getEffectivePermissions(currentUser.role);
      return perms.actions.includes(actionId);
    }

    function runAutomations() {
      let changed = false;
      const today = todayISO();

      state.creditCards.forEach(cc => {
        if (!cc.settled && cc.maturityDate <= today) {
          cc.settled = true;
          state.brand.etCapital = Number(state.brand.etCapital || 0) + Number(cc.amount || 0);
          changed = true;
        }
      });

      state.animals.forEach(an => {
        if (an.status === "Aktif" && an.breed === "Buzağı") {
          const ageDays = daysBetween(an.date, today);
          if (ageDays >= 365) {
            an.breed = "Sığır";
            an.promotedFromCalf = true;
            an.operations = an.operations || [];
            an.operations.push({
              id: uid("op"),
              date: today,
              title: "Otomatik 1 Yaş Terfisi (" + (an.gender === "Erkek" ? "Erkek Sığır" : "Dişi Sığır") + ")",
              cost: 0
            });
            changed = true;
          }
        }
      });

      if (changed) saveState();
    }

    function computeAnimalAccumulatedCost(an) {
      const endDate = (an.status === "Aktif") ? todayISO() : (an.exitDate || todayISO());
      const days = Math.max(0, daysBetween(an.date, endDate));
      const dailyFeedCost = Number(an.dailyFeedCost || 0) * days;
      const opsTotal = (an.operations || []).reduce((s, op) => s + Number(op.cost || 0), 0);
      return Number(an.purchasePrice || 0) + dailyFeedCost + opsTotal;
    }

    function getEffectiveBreedCategory(an) {
      if (an.breed === "Buzağı" && daysBetween(an.date, todayISO()) >= 365) {
        return "Sığır";
      }
      return an.breed;
    }

    function getHerdStats() {
      const stats = {
        erkekSigir: 0, disiSigir: 0, koyun: 0, manda: 0, angus: 0,
        disiBuzagi: 0, erkekBuzagi: 0, aktifToplam: 0
      };
      state.animals.forEach(an => {
        if (an.status !== "Aktif") return;
        stats.aktifToplam++;
        const cat = getEffectiveBreedCategory(an);
        if (cat === "Sığır") {
          if (an.gender === "Erkek") stats.erkekSigir++;
          else stats.disiSigir++;
        } else if (cat === "Koyun") {
          stats.koyun++;
        } else if (cat === "Manda") {
          stats.manda++;
        } else if (cat === "Angus") {
          stats.angus++;
        } else if (cat === "Buzağı") {
          if (an.gender === "Erkek") stats.erkekBuzagi++;
          else stats.disiBuzagi++;
        }
      });
      state.paddocks.forEach(p => {
        if (p.manualCounts) {
          Object.entries(p.manualCounts).forEach(([type, cnt]) => {
            const n = Number(cnt || 0);
            if (n <= 0) return;
            stats.aktifToplam += n;
            if (type === "Erkek Sığır") stats.erkekSigir += n;
            else if (type === "Dişi Sığır") stats.disiSigir += n;
            else if (type === "Koyun") stats.koyun += n;
            else if (type === "Manda") stats.manda += n;
            else if (type === "Angus") stats.angus += n;
            else if (type === "Erkek Buzağı") stats.erkekBuzagi += n;
            else if (type === "Dişi Buzağı") stats.disiBuzagi += n;
          });
        }
      });
      return stats;
    }

    function getFeedStocks() {
      const stocks = {};
      FEED_TYPES.forEach(f => stocks[f] = 0);
      state.feedMovements.forEach(m => {
        if (stocks[m.feedType] === undefined) stocks[m.feedType] = 0;
        if (m.type === "Giriş") stocks[m.feedType] += Number(m.qty || 0);
        else stocks[m.feedType] -= Number(m.qty || 0);
      });
      return stocks;
    }

    function getMedStocks() {
      const stocks = {};
      Object.keys(state.medThresholds).forEach(k => stocks[k] = { ml: 0, totalCost: 0, unitMlPrice: 0 });
      state.medMovements.forEach(m => {
        if (!stocks[m.medName]) stocks[m.medName] = { ml: 0, totalCost: 0, unitMlPrice: 0 };
        const totalMl = Number(m.ml || 0) * Number(m.qty || 1);
        if (m.type === "Giriş") {
          stocks[m.medName].ml += totalMl;
          stocks[m.medName].totalCost += Number(m.totalCost || 0);
        } else {
          stocks[m.medName].ml -= totalMl;
        }
      });
      Object.keys(stocks).forEach(k => {
        const entryMoves = state.medMovements.filter(m => m.medName === k && m.type === "Giriş");
        const sumMl = entryMoves.reduce((s, m) => s + (Number(m.ml || 0) * Number(m.qty || 1)), 0);
        const sumCost = entryMoves.reduce((s, m) => s + Number(m.totalCost || 0), 0);
        stocks[k].unitMlPrice = sumMl > 0 ? (sumCost / sumMl) : 0;
      });
      return stocks;
    }

    // =========================================================================
    // 5. HESAPLAMA MOTORLARI (ET, SAKATAT, AHIR)
    // =========================================================================
    function getEtMetricsForMonth(monthKey) {
      const sales = state.etSales.filter(s => getMonthKey(s.date) === monthKey && s.status === "Onaylandı");
      const slaughters = state.slaughters.filter(s => getMonthKey(s.date) === monthKey);
      const expenses = state.etExpenses.filter(e => getMonthKey(e.date) === monthKey);
      const sakatatMoves = state.slaughters.filter(s => getMonthKey(s.date) === monthKey);
      const sakatatAdj = state.sakatatAdjustments.filter(a => getMonthKey(a.date) === monthKey);

      const salesTotal = sales.reduce((sum, s) => sum + Number(s.grandTotal || 0), 0);
      const slaughterTotal = slaughters.reduce((sum, s) => sum + Number(s.totalAmount || 0), 0);
      const etSalesIncome = salesTotal - slaughterTotal;
      const expenseTotal = expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const etSalesProfit = etSalesIncome - expenseTotal;

      const sakatatRevenue = sakatatMoves.reduce((sum, s) => sum + Number(s.sakatatProductTotal || 0), 0);
      const sakatatSlaughterFee = sakatatMoves.reduce((sum, s) => sum + Number(s.sakatatSlaughterTotal || 0), 0);
      const adjSum = sakatatAdj.reduce((sum, a) => sum + Number(a.amount || 0), 0);
      const sakatatProfit = sakatatMoves.reduce((sum, s) => sum + Number(s.sakatatNetTotal || 0), 0) + adjSum;

      return {
        salesTotal,
        slaughterTotal,
        etSalesIncome,
        expenseTotal,
        etSalesProfit,
        sakatatRevenue,
        sakatatSlaughterFee,
        sakatatProfit
      };
    }

    function getGlobalEtYekun() {
      const totalApprovedSales = state.etSales
        .filter(s => s.status === "Onaylandı")
        .reduce((sum, s) => sum + Number(s.grandTotal || 0), 0);
      const totalPayments = state.etPayments
        .reduce((sum, p) => sum + Number(p.amount || 0), 0);
      return totalApprovedSales - totalPayments;
    }

    function getGlobalSakatatRemainingDebt() {
      const allNet = state.slaughters.reduce((sum, s) => sum + Number(s.sakatatNetTotal || 0), 0);
      const allAdj = state.sakatatAdjustments.reduce((sum, a) => sum + Number(a.amount || 0), 0);
      const allPaid = state.sakatatPayments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
      return (allNet + allAdj) - allPaid;
    }

    function getAhirMetricsForMonth(monthKey) {
      const expenses = state.ahirExpenses.filter(e => getMonthKey(e.date) === monthKey);
      const totalExpense = expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const exitedAnimals = state.animals.filter(a => a.status !== "Aktif" && getMonthKey(a.exitDate) === monthKey);
      const monthlyProfit = exitedAnimals.reduce((sum, a) => {
        const saleVal = Number(a.salePrice || 0);
        const accCost = computeAnimalAccumulatedCost(a);
        return sum + (saleVal - accCost);
      }, 0);
      return { totalExpense, monthlyProfit };
    }

    function trToAscii(str) {
      return String(str || "")
        .replace(/ğ/g, "g").replace(/Ğ/g, "G")
        .replace(/ü/g, "u").replace(/Ü/g, "U")
        .replace(/ş/g, "s").replace(/Ş/g, "S")
        .replace(/ı/g, "i").replace(/İ/g, "I")
        .replace(/ö/g, "o").replace(/Ö/g, "O")
        .replace(/ç/g, "c").replace(/Ç/g, "C")
        .replace(/₺/g, "TL");
    }

    function downloadDirectPdf() {
      if (!pdfPreviewData) return;
      try {
        const { jsPDF } = window.jspdf;
        const docPdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        docPdf.setFont("times", "normal");

        let y = 14;
        if (state.brand.logo && state.brand.logo.startsWith("data:image/")) {
          try {
            const imgFormat = state.brand.logo.includes("png") ? "PNG" : (state.brand.logo.includes("jpeg") || state.brand.logo.includes("jpg") ? "JPEG" : null);
            if (imgFormat) {
              docPdf.addImage(state.brand.logo, imgFormat, 93, y, 24, 24);
              y += 28;
            }
          } catch (imgErr) {}
        }

        docPdf.setFont("times", "bold");
        docPdf.setFontSize(14);
        docPdf.text(trToAscii(state.brand.name), 105, y, { align: "center" });
        y += 6;

        docPdf.setFont("times", "normal");
        docPdf.setFontSize(9);
        docPdf.text(trToAscii(`${state.brand.address} - Tel: ${state.brand.phone}`), 105, y, { align: "center" });
        y += 5;

        docPdf.setLineWidth(0.5);
        docPdf.line(14, y, 196, y);
        y += 8;

        docPdf.setFont("times", "bold");
        docPdf.setFontSize(12);
        docPdf.text(trToAscii(pdfPreviewData.title), 105, y, { align: "center" });
        y += 6;

        if (pdfPreviewData.subtitle) {
          docPdf.setFont("times", "italic");
          docPdf.setFontSize(9);
          docPdf.text(trToAscii(pdfPreviewData.subtitle), 105, y, { align: "center" });
          y += 7;
        }

        if (pdfPreviewData.customerInfo) {
          docPdf.setFont("times", "normal");
          docPdf.setFontSize(10);
          docPdf.rect(14, y, 182, 14);
          docPdf.text(trToAscii(`Musteri / Isletme: ${pdfPreviewData.customerInfo.businessName || pdfPreviewData.customerInfo.fullName}`), 17, y + 5);
          docPdf.text(trToAscii(`Yetkili: ${pdfPreviewData.customerInfo.fullName} | Tel: ${pdfPreviewData.customerInfo.phone || "-"}`), 17, y + 11);
          y += 19;
        }

        if (typeof docPdf.autoTable === "function") {
          docPdf.autoTable({
            startY: y,
            head: [pdfPreviewData.columns.map(c => trToAscii(c))],
            body: pdfPreviewData.rows.map(r => r.map(cell => trToAscii(cell))),
            styles: { font: "times", fontSize: 8.5, cellPadding: 2.5 },
            headStyles: { fillColor: [230, 230, 230], textColor: [0, 0, 0], fontStyle: "bold" },
            margin: { left: 14, right: 14 }
          });
          y = docPdf.lastAutoTable.finalY + 8;
        }

        docPdf.setFont("times", "bold");
        docPdf.setFontSize(10);
        (pdfPreviewData.summaryLines || []).forEach(line => {
          if (y > 275) { docPdf.addPage(); y = 20; }
          docPdf.text(trToAscii(line), 196, y, { align: "right" });
          y += 6;
        });

        docPdf.save(pdfPreviewData.fileName || "Dokum.pdf");
        showToast("Sade PDF dosyası doğrudan indirildi.");
      } catch (err) {
        showToast("PDF oluşturulurken hata oluştu.", "error");
      }
    }

    window.submitChangePassword = function (e) {
      e.preventDefault();
      if (!currentUser) return;
      const oldPass = document.getElementById("cp-old").value;
      const newPass = document.getElementById("cp-new").value.trim();
      const confirmPass = document.getElementById("cp-confirm").value.trim();

      const targetUser = state.users.find(u => u.id === currentUser.id);
      if (!targetUser || targetUser.password !== oldPass) {
        showToast("Mevcut şifreniz hatalı!", "error");
        return;
      }
      if (!newPass || newPass !== confirmPass) {
        showToast("Yeni şifreler birbiriyle eşleşmiyor!", "error");
        return;
      }

      targetUser.password = newPass;
      currentUser.password = newPass;
      try { localStorage.setItem(LOCAL_USER_KEY, JSON.stringify(currentUser)); } catch (err) {}
      saveState();
      closeModal();
      showToast("Şifreniz başarıyla güncellendi.");
    };

                    let rowClass = "bg-emerald-50 text-emerald-950";
                    if (d.paid) rowClass = "bg-white text-slate-400";
                    else if (diff <= 0) rowClass = "bg-rose-100 text-rose-950 font-semibold";

                    return `
                      <tr class="${rowClass}">

                        <td class="p-3 font-bold">${d.supplier}</td>

                        <td class="p-3 text-right">
                          ${!d.paid ? `<button onclick="openPayDeferredModal('${d.id}')" class="px-3 py-1 bg-slate-900 text-white rounded-lg text-[11px] font-bold">Ödendi</button>` : "-"}

    window.submitPayDeferred = function (e, defId) {
      e.preventDefault();
      const def = state.deferredPayables.find(d => d.id === defId);
      if (!def) return;
      const payDate = document.getElementById("def-pay-date").value;
      const payAmt = Number(document.getElementById("def-pay-amt").value || 0);
      def.paidAmount = Number(def.paidAmount || 0) + payAmt;
      state.brand.etCapital = Number(state.brand.etCapital || 0) - payAmt;
      if (def.paidAmount >= Number(def.totalAmount)) {
        def.paid = true;
        def.paidDate = payDate;
      }
      saveState();
      closeModal();
      showToast("Vadeli ödeme kaydedildi ve Et Sermayesinden düşüldü.");
    };

    window.submitAddEtSale = function (e) {
      e.preventDefault();
      const date = document.getElementById("ets-date").value;
      const customerName = document.getElementById("ets-customer").value.trim();
      const saleType = document.getElementById("ets-type").value;
      const matchedCust = state.users.find(u => u.role === "Müşteri" && (u.businessName === customerName || u.fullName === customerName));

      const rows = Array.from(document.querySelectorAll(".ets-item-row"));
      let hasMissingPrice = false;
      const items = rows.map(r => {
        const product = r.querySelector(".ets-prod").value;
        const kg = Number(r.querySelector(".ets-kg").value || 0);
        const rawPrice = r.querySelector(".ets-price").value;
        const unitPrice = rawPrice !== "" ? Number(rawPrice) : null;
        if (!unitPrice || unitPrice <= 0) hasMissingPrice = true;
        return { product, kg, unitPrice, subtotal: kg * (unitPrice || 0) };
      });

      const subtotal = items.reduce((s, it) => s + it.subtotal, 0);
      const vatAmount = saleType === "Faturalı" ? subtotal * 0.01 : 0;
      const grandTotal = subtotal + vatAmount;

      state.etSales.unshift({
        id: uid("ets"),
        date,
        customerId: matchedCust ? matchedCust.id : null,
        customerName,
        saleType,
        items,
        subtotal,
        vatAmount,
        grandTotal,
        hasMissingPrice,
        status: hasMissingPrice ? "Eksik Bilgi (Onay Bekliyor)" : "Yönetici Onayı Bekliyor"
      });
      saveState();
      closeModal();
      showToast("Satış kaydedildi ve yönetici onayına gönderildi.");
    };

    window.generateEtSalesPdf = function (e) {
      e.preventDefault();
      const start = document.getElementById("rep-ets-start").value;
      const end = document.getElementById("rep-ets-end").value;
      const custFilter = document.getElementById("rep-ets-cust").value.trim();

      const sales = state.etSales.filter(s => s.date >= start && s.date <= end && (!custFilter || s.customerName === custFilter));
      const payments = state.etPayments.filter(p => p.date >= start && p.date <= end && (!custFilter || p.customerName === custFilter));

      const totalSales = sales.filter(s => s.status === "Onaylandı").reduce((s, x) => s + Number(x.grandTotal || 0), 0);
      const totalPaid = payments.reduce((s, x) => s + Number(x.amount || 0), 0);
      const balance = totalSales - totalPaid;

      const customerObj = custFilter
        ? (state.users.find(u => u.businessName === custFilter || u.fullName === custFilter) || { businessName: custFilter, fullName: custFilter, phone: "-" })
        : null;

      const rows = [
        ...sales.map(s => [
          s.date,
          "ET SATIŞI",
          s.customerName,
          s.items.map(i => `${i.product} (${i.kg} Kg)`).join(", "),
          formatCurrency(s.grandTotal)
        ]),
        ...payments.map(p => [
          p.date,
          `ÖDEME (${p.method})`,
          p.customerName,
          p.dueDate ? `Vade: ${p.dueDate}` : "Tahsilat",
          `- ${formatCurrency(p.amount)}`
        ])
      ];

      closeModal();
      openPdfPreview({
        title: custFilter ? "MÜŞTERİ CARİ EKSTRE & ET SATIŞ DÖKÜMÜ" : "ET SATIŞ & TAHSİLAT HAREKETLERİ DÖKÜMÜ",
        subtitle: `Tarih Aralığı: ${start} — ${end}`,
        customerInfo: customerObj,
        columns: ["Tarih", "İşlem Türü", "Müşteri / İşletme", "Açıklama / Ürün", "Tutar"],
        rows: rows.length > 0 ? rows : [["-", "-", "-", "Kayıt bulunamadı", "-"]],
        summaryLines: [
          `TOPLAM ONAYLI SATIŞ TUTARI: ${formatCurrency(totalSales)}`,
          `TOPLAM YAPILAN ÖDEME: ${formatCurrency(totalPaid)}`,
          `KALAN BAKİYE: ${formatCurrency(balance)}`
        ],
        fileName: `Et_Satis_Dokumu_${start}_${end}.pdf`
      });
    };

    window.submitAddSlaughter = function (e) {
      e.preventDefault();
      const date = document.getElementById("sl-date").value;
      const supplier = document.getElementById("sl-supplier").value.trim();
      const breed = document.getElementById("sl-breed").value;
      const count = Number(document.getElementById("sl-count").value || 1);
      const kg = Number(document.getElementById("sl-kg").value || 0);
      const unitPrice = Number(document.getElementById("sl-price").value || 0);
      const payType = document.getElementById("sl-paytype").value;
      const isKelle = document.getElementById("sl-kelle").checked;
      const dueDate = payType === "Vadeli" ? document.getElementById("sl-due").value : "";
      const totalAmount = kg * unitPrice;

      const sakatatPriceMap = {
        "İnek": state.prices.inekSakatat,
        "Düve": state.prices.duveSakatat,
        "Tosun": state.prices.tosunSakatat,
        "Dana": state.prices.danaSakatat,
        "Manda": state.prices.mandaSakatat,
        "Angus": state.prices.angusSakatat,
        "Koyun": state.prices.koyunSakatat
      };
      const sakatatUnitPrice = Number(sakatatPriceMap[breed] || 0);
      const sakatatProductTotal = breed === "Koyun" ? (count * sakatatUnitPrice) : (kg * sakatatUnitPrice);
      const perHeadSlaughter = breed === "Koyun" ? Number(state.prices.kucukbasKesim || 0) : Number(state.prices.buyukbasKesim || 0);
      const sakatatSlaughterTotal = count * perHeadSlaughter;
      const sakatatNetTotal = isKelle ? 0 : (sakatatProductTotal - sakatatSlaughterTotal);

      const slId = uid("sl");
      state.slaughters.unshift({
        id: slId,
        date,
        supplier,
        breed,
        count,
        kg,
        unitPrice,
        totalAmount,
        payType,
        dueDate,
        isKelle,
        sakatatUnitPrice,
        sakatatProductTotal,
        sakatatSlaughterTotal,
        sakatatNetTotal
      });

      if (payType === "Nakit") {
        state.brand.etCapital = Number(state.brand.etCapital || 0) - totalAmount;
      } else {
        state.deferredPayables.unshift({
          id: uid("def"),
          slaughterId: slId,
          date,
          supplier,
          dueDate,
          totalAmount,
          paidAmount: 0,
          paid: false,
          paidDate: ""
        });
      }

      saveState();
      closeModal();
      showToast("Kesim ve sakatat kayıtları oluşturuldu.");
    };

    window.generateSakatatPdf = function (e) {

      const filteredSl = state.slaughters.filter(s => s.date >= start && s.date <= end);

      const netProfit = filteredSl.reduce((s, x) => s + Number(x.sakatatNetTotal || 0), 0);
      const paidSum = filteredPay.reduce((s, x) => s + Number(x.amount || 0), 0);
      const remDebt = getGlobalSakatatRemainingDebt();

      const rows = [
        ...filteredSl.map(s => [
          s.date,
          `${s.count} Adet ${s.breed}`,
          `${formatNumber(s.kg)} Kg`,
          formatCurrency(s.sakatatProductTotal),
          formatCurrency(s.sakatatSlaughterTotal),
          formatCurrency(s.sakatatNetTotal)
        ]),
        ...filteredPay.map(p => [
          p.date,
          `ÖDEME: ${p.note}`,
          "-",
          "-",
          "-",
          `- ${formatCurrency(p.amount)}`
        ])
      ];

      closeModal();
      openPdfPreview({
        title: "SAKATAT HESABI & ÖDEME HAREKETLERİ DÖKÜMÜ",
        subtitle: `Tarih Aralığı: ${start} — ${end}`,
        columns: ["Tarih", "İşlem / Hayvan", "Kilogram", "Ürün Tutarı", "Kesim Bedeli", "Net Tutar"],

          `DÖNEM SAKATAT NET KÂRI: ${formatCurrency(netProfit)}`,

    window.submitAddAhirExpense = function (e) {
      e.preventDefault();
      const date = document.getElementById("ae-date").value;
      const type = document.getElementById("ae-type").value;
      const amount = Number(document.getElementById("ae-amount").value || 0);
      let detail = "";

      if (type === "Yem Gideri") {
        const feedType = document.getElementById("ae-feed-type").value;
        const qty = Number(document.getElementById("ae-feed-qty").value || 0);
        const unitPrice = Number(document.getElementById("ae-feed-price").value || 0);
        detail = `${feedType} (${qty} Kg)`;
        state.feedMovements.unshift({
          id: uid("fm"),
          date,
          type: "Giriş",
          feedType,
          qty,
          unitPrice,
          totalCost: amount,
          note: "Ahır Yem Gideri Alımı"
        });
      } else if (type === "İlaç Gideri") {
        const medName = document.getElementById("ae-med-name").value.trim() || "Genel İlaç";
        const ml = Number(document.getElementById("ae-med-ml").value || 0);
        const qty = Number(document.getElementById("ae-med-qty").value || 1);
        detail = `${medName} (${ml} ml x ${qty})`;
        if (state.medThresholds[medName] === undefined) state.medThresholds[medName] = 100;
        state.medMovements.unshift({
          id: uid("mm"),
          date,
          type: "Giriş",
          medName,
          ml,
          qty,
          totalCost: amount,
          note: "Ahır İlaç Gideri Alımı"
        });
      } else if (type === "Çoban Maaşı" || type === "Diğer Giderler") {
        detail = type === "Çoban Maaşı"
          ? `Çoban: ${document.getElementById("ae-shepherd").value.trim()}`
          : document.getElementById("ae-other-desc").value.trim();

        const activeAnimals = state.animals.filter(a => a.status === "Aktif");
        const totalShares = activeAnimals.reduce((sum, a) => {
          const cat = getEffectiveBreedCategory(a);
          const isLarge = ["Sığır", "Manda", "Angus"].includes(cat);
          return sum + (isLarge ? 5 : 1);
        }, 0);

        if (totalShares > 0) {
          const perShare = amount / totalShares;
          activeAnimals.forEach(a => {
            const cat = getEffectiveBreedCategory(a);
            const share = ["Sığır", "Manda", "Angus"].includes(cat) ? 5 : 1;
            a.operations = a.operations || [];
            a.operations.push({
              id: uid("op"),
              date,
              title: `${type} Payı (${share} Pay)`,
              cost: perShare * share
            });
          });
        }
      }

      state.ahirExpenses.unshift({ id: uid("ae"), date, type, detail, amount });
      state.brand.ahirCapital = Number(state.brand.ahirCapital || 0) - amount;
      saveState();
      closeModal();
      showToast("Ahır gideri kaydedildi ve sermayeden düşüldü.");
    };

    window.applyPlannedVetTask = function (taskId) {
      const task = state.plannedVetTasks.find(t => t.id === taskId);
      if (!task || task.applied) return;
      const today = todayISO();
      const stocks = getMedStocks();
      const unitMl = Number(stocks[task.medName]?.unitMlPrice || 0);
      const cost = Number(task.ml) * unitMl;

      task.applied = true;
      task.appliedDate = today;

      state.medMovements.unshift({
        id: uid("mm"),
        date: today,
        type: "Çıkış",
        medName: task.medName,
        ml: task.ml,
        qty: 1,
        totalCost: cost,
        note: `Planlı Uygulama (${task.officialTag})`
      });

      const an = state.animals.find(a => a.id === task.animalId);
      if (an) {

    window.handleInvoicePdfUpload = function (e, saleId) {
      const file = e.target.files?.[0];
      if (!file) return;
      const sale = state.etSales.find(s => s.id === saleId);
      if (!sale) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        sale.invoiceUploaded = true;
        sale.invoiceFileName = file.name;
        sale.invoiceDataUrl = ev.target.result;
        saveState();
        showToast("Satış faturası PDF olarak yüklendi.");
        render();
      };
      reader.readAsDataURL(file);
    };

    window.previewUploadedInvoice = function (saleId) {
      const sale = state.etSales.find(s => s.id === saleId);
      if (!sale || !sale.invoiceDataUrl) {
        showToast("Fatura PDF dosyası bulunamadı.", "error");
        return;
      }
      const a = document.createElement("a");
      a.href = sale.invoiceDataUrl;
      a.download = sale.invoiceFileName || `Fatura_${sale.customerName}.pdf`;
      a.click();
    };

        mandaSakatat: Number(document.getElementById("pr-manda").value || 0),
        angusSakatat: Number(document.getElementById("pr-angus").value || 0),
        koyunSakatat: Number(document.getElementById("pr-koyun").value || 0)

    window.handleLogoUpload = function (e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        state.brand.logo = ev.target.result;
        saveState();
        showToast("İşletme logosu güncellendi.");
        render();
      };
      reader.readAsDataURL(file);
    };

    window.saveBrandSettings = function (e) {
      e.preventDefault();
      state.brand.name = document.getElementById("br-name").value.trim();
      state.brand.address = document.getElementById("br-address").value.trim();
      state.brand.phone = document.getElementById("br-phone").value.trim();
      state.brand.etCapital = Number(document.getElementById("br-etcap").value || 0);
      state.brand.ahirCapital = Number(document.getElementById("br-ahircap").value || 0);
      saveState();
      showToast("Marka ve sermaye ayarları kaydedildi.");
      render();
    };

    window.saveCustomFirebaseConfig = function () {
      const raw = document.getElementById("fb-custom-json")?.value.trim();
      if (!raw) {
        localStorage.removeItem(CUSTOM_FB_CONFIG_KEY);
        showToast("Özel bulut ayarı temizlendi.");
        return;
      }
      try {
        JSON.parse(raw);
        localStorage.setItem(CUSTOM_FB_CONFIG_KEY, raw);
        initCloudSync();
        showToast("Firebase bulut yapılandırması kaydedildi ve bağlanılıyor...");
      } catch (e) {
        showToast("Geçersiz JSON formatı!", "error");
      }
    };

    window.exportBackupJson = function () {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `ERP_Yedek_${todayISO()}.json`;
      a.click();
    };

    window.importBackupJson = function (e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        try {
          const parsed = JSON.parse(ev.target.result);
          state = { ...cloneObj(INITIAL_STATE), ...parsed };
          saveState();
          showToast("Yedek dosyası başarıyla geri yüklendi.");
          render();
        } catch (err) {
          showToast("Yedek dosyası okunamadı.", "error");
        }
      };
      reader.readAsText(file);
    };

      row.className = "grid grid-cols-12 gap-2 items-center ras-feed-row";
      row.innerHTML = `

        </div>

    window.updateRasyonLivePreview = function () {
      const animalCount = Math.max(1, Number(document.getElementById("ras-animal-count")?.value || 1));
      const mode = document.getElementById("ras-input-mode")?.value || "total";
      const rows = Array.from(document.querySelectorAll(".ras-feed-row"));
      let groupTotal = 0;

      rows.forEach(r => {
        const kg = Number(r.querySelector(".ras-row-kg")?.value || 0);
        const price = Number(r.querySelector(".ras-row-price")?.value || 0);
        const effectiveKg = mode === "per_head" ? (kg * animalCount) : kg;
        groupTotal += effectiveKg * price;
      });

      const perHead = groupTotal / animalCount;
      const gEl = document.getElementById("ras-live-group-total");
      const pEl = document.getElementById("ras-live-per-head");
      if (gEl) gEl.textContent = formatCurrency(groupTotal);
      if (pEl) pEl.textContent = formatCurrency(perHead) + " / Gün";
    };

    window.calculateRasyon = function (e) {
      e.preventDefault();
      const date = document.getElementById("ras-date").value;
      const groupName = document.getElementById("ras-group").value.trim();
      const animalCount = Math.max(1, Number(document.getElementById("ras-animal-count").value || 1));
      const mode = document.getElementById("ras-input-mode").value;
      const rows = Array.from(document.querySelectorAll(".ras-feed-row"));

      let groupTotalCost = 0;
      const summaryParts = [];

      rows.forEach(r => {
        const feed = r.querySelector(".ras-row-feed").value;
        const kg = Number(r.querySelector(".ras-row-kg").value || 0);
        const price = Number(r.querySelector(".ras-row-price").value || 0);
        const effectiveKg = mode === "per_head" ? (kg * animalCount) : kg;
        groupTotalCost += effectiveKg * price;
        summaryParts.push(`${feed}: ${formatNumber(effectiveKg)} Kg`);
      });

      const perAnimalDailyCost = groupTotalCost / animalCount;
      state.rasyonLogs = state.rasyonLogs || [];
      state.rasyonLogs.unshift({
        id: uid("ras"),
        date,
        groupName,
        animalCount,
        itemsSummary: summaryParts.join(", "),
        groupTotalCost,
        perAnimalDailyCost
      });
      saveState();
      showToast("Rasyon maliyeti hesaplandı ve hareketlere kaydedildi.");
      render();
    };

    window.deleteRasyonLog = function (rasId) {
      state.rasyonLogs = (state.rasyonLogs || []).filter(r => r.id !== rasId);
      saveState();
      showToast("Rasyon hesaplama kaydı silindi.");
      render();
    };

                <input type="number" step="0.01" min="0.01" id="erec-amount" value="${r.amount}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-bold" />
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">İptal</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-800 text-white text-sm font-semibold hover:bg-emerald-900">Güncelle</button>
              </div>
            </form>
          </div>
        </div>
      `;
      render();
    };

    window.submitEditExpenseReceipt = function (e, recId) {
      e.preventDefault();
      const r = (state.expenseReceipts || []).find(x => x.id === recId);
      if (!r) return;
      r.date = document.getElementById("erec-date").value;
      r.receiptNo = document.getElementById("erec-no").value.trim();
      r.vendor = document.getElementById("erec-vendor").value.trim();
      r.desc = document.getElementById("erec-desc").value.trim();
      r.amount = Number(document.getElementById("erec-amount").value || 0);
      saveState();
      closeModal();
      showToast("Gider fişi güncellendi.");
    };

    window.deleteExpenseReceipt = function (recId) {
      if (!["Admin", "Muhasebe"].includes(currentUser?.role)) return;
      state.expenseReceipts = (state.expenseReceipts || []).filter(r => r.id !== recId);
      saveState();
      showToast("Gider fişi silindi.");
      render();
    };

    window.openAddExpenseReceiptModal = function () {
      modalHtml = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
              <h3 class="text-lg font-bold text-slate-900">Yeni Gider Fişi Ekle</h3>
              <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="submitAddExpenseReceipt(event)" class="space-y-4">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Tarih</label>
                  <input type="date" id="rec-date" value="${todayISO()}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Fiş / Fatura No</label>
                  <input type="text" id="rec-no" placeholder="Örn: FİŞ-2026-01" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Firma / Satıcı Adı</label>
                <input type="text" id="rec-vendor" required placeholder="Örn: Akaryakıt İstasyonu" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Açıklama</label>
                <input type="text" id="rec-desc" required placeholder="Harcama detayı" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Fiş Tutarı (TL)</label>
                <input type="number" step="0.01" min="0.01" id="rec-amount" required class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-bold" />
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">İptal</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-800 text-white text-sm font-semibold hover:bg-emerald-900">Kaydet</button>
              </div>
            </form>
          </div>
        </div>
      `;
      render();
    };

    window.submitAddExpenseReceipt = function (e) {
      e.preventDefault();
      state.expenseReceipts = state.expenseReceipts || [];
      state.expenseReceipts.unshift({
        id: uid("rec"),
        date: document.getElementById("rec-date").value,
        receiptNo: document.getElementById("rec-no").value.trim(),
        vendor: document.getElementById("rec-vendor").value.trim(),
        desc: document.getElementById("rec-desc").value.trim(),
        amount: Number(document.getElementById("rec-amount").value || 0)
      });
      saveState();
      closeModal();
      showToast("Gider fişi kaydedildi.");
    };

    window.openReceiptPdfFilterModal = function () {
      modalHtml = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
              <h3 class="text-lg font-bold text-slate-900">Gider Fişleri PDF Dökümü</h3>
              <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="generateReceiptsPdf(event)" class="space-y-4">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Başlangıç Tarihi</label>
                  <input type="date" id="rep-rec-start" value="${todayISO().slice(0,8)}01" required class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Bitiş Tarihi</label>
                  <input type="date" id="rep-rec-end" value="${todayISO()}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                </div>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">İptal</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-800 text-white text-sm font-semibold">Ön İzleme Oluştur</button>
              </div>
            </form>
          </div>
        </div>
      `;
      render();
    };

    window.generateReceiptsPdf = function (e) {
      e.preventDefault();
      const start = document.getElementById("rep-rec-start").value;
      const end = document.getElementById("rep-rec-end").value;
      const filtered = (state.expenseReceipts || []).filter(r => r.date >= start && r.date <= end);
      const total = filtered.reduce((s, r) => s + Number(r.amount || 0), 0);
      closeModal();
      openPdfPreview({
        title: "GİDER FİŞLERİ DÖKÜM RAPORU",
        subtitle: `Tarih Aralığı: ${start} — ${end}`,
        columns: ["Tarih", "Fiş No", "Firma / Kurum", "Açıklama", "Tutar"],
        rows: filtered.length > 0 ? filtered.map(r => [r.date, r.receiptNo || "-", r.vendor, r.desc, formatCurrency(r.amount)]) : [["-", "-", "Kayıt bulunamadı", "-", "-"]],
        summaryLines: [`TOPLAM GİDER FİŞİ TUTARI: ${formatCurrency(total)}`],
        fileName: `Gider_Fisleri_${start}_${end}.pdf`
      });
    };

    // =========================================================================
    // 14. PDF ÖN İZLEME MODAL & ANA UYGULAMA ÇERÇEVESİ
    // =========================================================================
    function renderPdfPreviewModal() {
      if (!pdfPreviewData) return "";
      return `
        <div class="fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-slate-100 rounded-2xl max-w-4xl w-full p-4 sm:p-6 shadow-2xl space-y-4 my-auto">
            <div class="flex flex-wrap items-center justify-between gap-2 bg-white p-3.5 rounded-xl border border-slate-200">
              <div class="text-xs font-bold text-slate-700"><i class="fa-solid fa-eye text-emerald-700 mr-1.5"></i>Times New Roman Resmi PDF Ön İzlemesi</div>
              <div class="flex items-center gap-2">
                <button onclick="downloadDirectPdf()" class="px-4 py-2 bg-emerald-800 hover:bg-emerald-900 text-white rounded-xl text-xs font-bold shadow">
                  <i class="fa-solid fa-file-arrow-down mr-1.5"></i>İndir (PDF)
                </button>
                <button onclick="closePdfPreview()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-xs font-bold">Kapat</button>
              </div>
            </div>

            <div class="pdf-preview-sheet p-8 sm:p-12 rounded-xl border border-slate-300 max-h-[75vh] overflow-y-auto">
              <div class="flex flex-col items-center text-center border-b-2 border-slate-900 pb-5 mb-6">
                <img src="${state.brand.logo}" alt="Logo" class="w-20 h-20 object-contain mb-3 mx-auto block" />
                <h1 class="text-xl font-bold tracking-wide uppercase">${state.brand.name}</h1>
                <p class="text-xs mt-1">${state.brand.address} — Tel: ${state.brand.phone}</p>
              </div>

              <div class="text-center mb-6">
                <h2 class="text-lg font-bold underline">${pdfPreviewData.title}</h2>
                ${pdfPreviewData.subtitle ? `<p class="text-xs italic mt-1">${pdfPreviewData.subtitle}</p>` : ""}
              </div>

              ${pdfPreviewData.customerInfo ? `
                <div class="border border-slate-400 p-3 mb-5 text-xs bg-slate-50">
                  <div><strong>Müşteri / İşletme Adı:</strong> ${pdfPreviewData.customerInfo.businessName || pdfPreviewData.customerInfo.fullName}</div>
                  <div class="mt-1"><strong>Yetkili Kişi:</strong> ${pdfPreviewData.customerInfo.fullName} | <strong>Telefon:</strong> ${pdfPreviewData.customerInfo.phone || "-"}</div>
                </div>
              ` : ""}

              <table class="w-full border-collapse border border-slate-800 text-xs mb-6">
                <thead>
                  <tr class="bg-slate-200">
                    ${pdfPreviewData.columns.map(c => `<th class="border border-slate-800 p-2 text-left font-bold">${c}</th>`).join("")}
                  </tr>
                </thead>
                <tbody>
                  ${pdfPreviewData.rows.map(r => `
                    <tr>
                      ${r.map(cell => `<td class="border border-slate-800 p-2">${cell}</td>`).join("")}
                    </tr>
                  `).join("")}
                </tbody>
              </table>

              <div class="text-right space-y-1 text-sm font-bold">
                ${(pdfPreviewData.summaryLines || []).map(l => `<div>${l}</div>`).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    window.downloadDirectPdf = downloadDirectPdf;
    window.closePdfPreview = closePdfPreview;

    function render() {
      const root = document.getElementById("app");
      if (!root) return;

      if (!currentUser) {
        root.innerHTML = renderLoginScreen() + (toastMessage ? `
          <div class="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-xs font-bold text-white ${toastMessage.type === 'error' ? 'bg-rose-600' : 'bg-emerald-800'}">
            ${toastMessage.msg}
          </div>
        ` : "");
        return;
      }

      const visibleModules = ALL_MODULES.filter(m => hasTabAccess(m.id));
      if (!visibleModules.some(m => m.id === activeTab) && visibleModules.length > 0) {
        activeTab = visibleModules[0].id;
      }

      let mainBody = "";
      if (activeTab === "genel-bakis") mainBody = renderOverviewModule();
      else if (activeTab === "borc-odeme") mainBody = renderDebtPaymentModule();
      else if (activeTab === "et-hesabi") mainBody = renderEtAccountModule();
      else if (activeTab === "ahir-hesabi") mainBody = renderAhirAccountModule();
      else if (activeTab === "suru-yonetimi") mainBody = renderHerdManagementModule();
      else if (activeTab === "rasyon-takibi") mainBody = renderRasyonModule();
      else if (activeTab === "yem-stok") mainBody = renderFeedStockModule();
      else if (activeTab === "ilac-stok") mainBody = renderMedStockModule();
      else if (activeTab === "birikim-takibi") mainBody = renderSavingsModule();
      else if (activeTab === "gider-fisi" || activeTab === "muhasebe-gider-fisleri") mainBody = renderExpenseReceiptsModule();
      else if (activeTab === "veteriner-takvim") mainBody = renderVetCalendarModule();
      else if (activeTab === "muhasebe-faturali") mainBody = renderAccountingInvoicesModule();
      else if (activeTab === "kullanici-yetki") mainBody = renderUsersPermissionsModule();
      else if (activeTab === "guncel-fiyatlar") mainBody = renderPricesModule();
      else if (activeTab === "ayarlar-marka") mainBody = renderBrandSettingsModule();

      const activeModLabel = ALL_MODULES.find(m => m.id === activeTab)?.label || "";

      root.innerHTML = `
        <div class="min-h-screen w-full max-w-full flex flex-col lg:flex-row bg-[#f6f8f7] overflow-x-hidden">
          <!-- Sol Gezinme Menüsü (Büyük ekranlarda sabit genişlikte ve taşmasız) -->
          <aside class="w-full lg:w-72 lg:min-w-[18rem] lg:max-w-[18rem] lg:sticky lg:top-0 lg:h-screen bg-[#0f3d2e] text-white flex flex-col shrink-0 shadow-xl z-20">
            <div class="p-5 border-b border-emerald-800/70 flex items-center gap-3">
              <img src="${state.brand.logo}" alt="Logo" class="w-11 h-11 rounded-xl bg-white p-1 object-contain shrink-0" />
              <div class="min-w-0">
                <div class="font-extrabold text-sm tracking-tight truncate">${state.brand.name}</div>
                <div class="text-[11px] text-emerald-200 truncate">${currentUser.fullName} (${currentUser.role})</div>
              </div>
            </div>

            <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
              ${visibleModules.map(m => `
                <button onclick="switchTab('${m.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-left ${activeTab === m.id ? 'bg-white text-[#0f3d2e] font-extrabold shadow' : 'text-emerald-100 hover:bg-emerald-800/60'}">
                  <i class="fa-solid ${m.icon} w-4 text-center"></i>
                  <span class="truncate">${m.label}</span>
                </button>
              `).join("")}
            </nav>

            <div class="p-4 border-t border-emerald-800/70 space-y-2.5">
              <div class="text-[10px] text-emerald-200 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="truncate">${cloudStatus}</span>
              </div>
              <button onclick="handleLogout()" class="w-full py-2 rounded-xl bg-rose-600/90 hover:bg-rose-600 text-white text-xs font-bold transition">
                <i class="fa-solid fa-right-from-bracket mr-1.5"></i>Güvenli Çıkış
              </button>
            </div>
          </aside>

          <!-- Sağ Ana İçerik Alanı (Geniş monitörlerde ortalanmış ve yatay kaymasız) -->
          <main class="flex-1 min-w-0 flex flex-col">
            <header class="bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap items-center justify-between gap-2 sticky top-0 z-10">
              <div class="min-w-0">
                <h2 class="text-base sm:text-lg font-extrabold text-slate-900 truncate">${activeModLabel}</h2>
              </div>
              <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                <button onclick="openChangePasswordModal()" class="px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-900 border border-emerald-200 text-xs font-bold transition">
                  <i class="fa-solid fa-key mr-1.5 text-emerald-700"></i>Şifre Değiştir
                </button>
                <span class="px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">
                  <i class="fa-regular fa-calendar mr-1.5 text-emerald-700"></i>${todayISO()}
                </span>
              </div>
            </header>

            <div class="p-4 sm:p-6 lg:p-8 flex-1 w-full max-w-7xl mx-auto">
              ${mainBody}
            </div>
          </main>
        </div>

        ${modalHtml}
        ${renderPdfPreviewModal()}
        ${toastMessage ? `
          <div class="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl text-xs font-bold text-white ${toastMessage.type === 'error' ? 'bg-rose-600' : 'bg-emerald-800'}">
            <i class="fa-solid ${toastMessage.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} mr-1.5"></i>${toastMessage.msg}
          </div>
        ` : ""}
      `;
    }

    // Başlangıç
    runAutomations();
    render();
    initCloudSync();
  </script>
</body>
</html>
